services:
  cashrouteai:
    build: .
    container_name: cashrouteai_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-AIzaSyC1o-JQk5umzad6Ag4wxcO-UuUU6LbqXTM}
    volumes:
      - ./database:/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
